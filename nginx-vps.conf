server
{
    listen 80;
    listen 443 ssl http2 ;
    server_name services.smartlearn.education;
    index index.html index.htm;
    root /www/wwwroot/services.smartlearn.education/frontend;
    include /www/server/panel/vhost/nginx/extension/services.smartlearn.education/*.conf;

    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/services.smartlearn.education.conf;
    #CERT-APPLY-CHECK--END

    #SSL-START
    ssl_certificate    /www/server/panel/vhost/cert/services.smartlearn.education/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/services.smartlearn.education/privkey.pem;
    
    # Secure modern TLS protocols only (TLS 1.1 dropped)
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Modern secure ciphers (3DES and weak RSA ciphers dropped to prevent SWEET32)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # Essential HTTP Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    
    error_page 497 https://$host$request_uri;
    #SSL-END

    # ── AI Agent Discovery headers ────────────────────────────────────────────
    add_header Link "</.well-known/ai-catalog.json>; rel=\"ai-catalog\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/mcp/server-card.json>; rel=\"mcp-server\", </.well-known/agent-skills/index.json>; rel=\"agent-skills\"" always;

    #ERROR-PAGE-START
    error_page 404 /404.html;
    error_page 502 /502.html;
    #ERROR-PAGE-END

    #REWRITE-START
    include /www/server/panel/vhost/rewrite/services.smartlearn.education.conf;
    #REWRITE-END

    # ── React SPA routing fallback & AI Markdown Content Negotiation ──────────
    location / {
        if ($http_accept ~* "text/markdown") {
            rewrite ^(.*)/$ $1/index.md last;
            rewrite ^(.*)$ $1.md last;
        }
        try_files $uri $uri/ /index.html;
    }

    # ── Serve Markdown files for AI Agents with text/markdown Content-Type ────
    location ~* \.md$ {
        default_type "text/markdown; charset=utf-8";
        add_header Vary "Accept" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Link "</.well-known/ai-catalog.json>; rel=\"ai-catalog\", </.well-known/api-catalog>; rel=\"api-catalog\", </.well-known/mcp/server-card.json>; rel=\"mcp-server\", </.well-known/agent-skills/index.json>; rel=\"agent-skills\"" always;
        try_files $uri /index.md =404;
    }

    # API proxy — forwards /api/ to Node.js on port 8080
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── API Catalog Linkset File ──────────────────────────────────────────────
    location = /.well-known/api-catalog {
        default_type application/linkset+json;
        alias /www/wwwroot/services.smartlearn.education/frontend/.well-known/api-catalog;
    }

    # Allow ACME Challenge & Well-Known
    location ~ /\.well-known {
        allow all;
    }

    # Block executable or sensitive files in well-known
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # Block sensitive hidden files, env configurations, git repositories, backups, and dumps
    location ~* (?:^|/)(?:\.git|\.env|\.user\.ini|\.htaccess|\.svn|\.project|.*\.bak|.*\.backup|.*\.sql|.*\.tar\.gz|.*\.zip)$ {
        return 404;
    }

    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf)$
    {
        expires      30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    location ~ .*\.(js|css)?$
    {
        expires      12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/services.smartlearn.education.log;
    error_log  /www/wwwlogs/services.smartlearn.education.error.log;
}
